# Render Blueprint — CHỈ web service (dashboard + bot Telegram webhook).
#
# ⚠️ KHÔNG đặt cron ở đây: các tác vụ theo lịch (tin 09:00/14:00, quá nóng 09:30, penny 09:35,
#    chấm điểm 17:00) ĐÃ chạy MIỄN PHÍ trên GitHub Actions (.github/workflows/scheduled.yml).
#    Bật cron ở cả hai nơi = mỗi tin Telegram gửi 2 lần + tốn gấp đôi tiền LLM.
#    (Nếu sau này muốn bỏ GitHub Actions và chuyển hết sang Render, xem git history của file này.)
#
# Web service này làm 2 việc:
#   1. Dashboard  → https://<ten-service>.onrender.com
#   2. Bot Telegram 24/7 qua webhook → POST /telegram/webhook
#      (gói free ngủ khi rảnh nhưng TỰ THỨC khi Telegram đẩy tin vào)
#
# DB: dùng Postgres miễn phí bên ngoài (Supabase/Neon) qua biến DATABASE_URL.

envVarGroups:
  - name: stock-secrets
    envVars:
      - key: TZ
        value: Asia/Ho_Chi_Minh          # để date.today() đúng ngày VN
      - key: DATA_SOURCE
        value: vnstock
      - key: OPENAI_MODEL
        value: gpt-5.6-luna              # đo thật: chuẩn nhất + rẻ (~$2-3/tháng). Xem README.
      - key: OPENAI_REASONING_EFFORT
        value: medium
      - key: VNSTOCK_WATCHLIST
        value: "ACB,BCM,BID,BVH,CTG,FPT,GAS,GVR,HDB,HPG,MBB,MSN,MWG,PLX,POW,SAB,SHB,SSB,SSI,STB,TCB,TPB,VCB,VHM,VIB,VIC,VJC,VNM,VPB,VRE"
      # Các bí mật — điền trong Render UI (không lưu vào file):
      - key: DATABASE_URL                 # chuỗi kết nối Postgres (Supabase/Neon)
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET      # bí mật xác thực webhook (scripts/set_webhook.py sinh ra)
        sync: false
      - key: DASHBOARD_BASE_URL           # URL web sau khi deploy (vd https://xxx.onrender.com)
        sync: false

services:
  # Dashboard + bot webhook (gói free — ngủ khi không dùng, tự thức khi có request)
  - type: web
    name: stock-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - fromGroup: stock-secrets
