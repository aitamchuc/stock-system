# Render Blueprint — deploy không cần VPS.
# Gồm: 1 web dashboard (free) + 4 cron job chạy script theo lịch (KHÔNG cần Redis/Celery).
# DB: dùng Postgres miễn phí bên ngoài (Neon/Supabase) qua biến DATABASE_URL (bí mật).
#
# Lịch dùng giờ UTC (Render cron luôn UTC). Quy đổi giờ VN (UTC+7):
#   09:00 VN = 02:00 UTC | 14:00 VN = 07:00 UTC | 17:00 VN = 10:00 UTC | 17:30 VN = 10:30 UTC

envVarGroups:
  - name: stock-secrets
    envVars:
      - key: TZ
        value: Asia/Ho_Chi_Minh          # để date.today() đúng ngày VN
      - key: DATA_SOURCE
        value: vnstock
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: VNSTOCK_WATCHLIST
        value: "ACB,BCM,BID,BVH,CTG,FPT,GAS,GVR,HDB,HPG,MBB,MSN,MWG,PLX,POW,SAB,SHB,SSB,SSI,STB,TCB,TPB,VCB,VHM,VIB,VIC,VJC,VNM,VPB,VRE"
      # Các bí mật — điền trong Render UI (không lưu vào file):
      - key: DATABASE_URL                 # chuỗi kết nối Postgres từ Neon/Supabase
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DASHBOARD_BASE_URL           # URL web sau khi deploy (vd https://stock-dashboard.onrender.com)
        sync: false

services:
  # Dashboard web (gói free — ngủ khi không dùng, tự thức khi truy cập)
  - type: web
    name: stock-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - fromGroup: stock-secrets

  # 09:00 VN — quét tin + AI phân tích ảnh hưởng
  - type: cron
    name: news-morning
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 2 * * 1-5"
    dockerCommand: python -m app.news_scan
    envVars:
      - fromGroup: stock-secrets

  # 14:00 VN — quét tin phiên chiều
  - type: cron
    name: news-afternoon
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 7 * * 1-5"
    dockerCommand: python -m app.news_scan
    envVars:
      - fromGroup: stock-secrets

  # 17:00 VN — nạp dữ liệu + chấm điểm + AI chọn cổ phiếu nên đầu tư
  - type: cron
    name: daily-pipeline
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 10 * * 1-5"
    dockerCommand: python -m app.pipeline
    envVars:
      - fromGroup: stock-secrets

  # 17:30 VN — quét cổ phiếu penny tiềm năng
  - type: cron
    name: penny-scan
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "30 10 * * 1-5"
    dockerCommand: python -m app.penny
    envVars:
      - fromGroup: stock-secrets
